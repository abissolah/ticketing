<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Connexion | Support</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    :root {
      --app-primary: #14b8a6;
      --app-primary-dark: #0d9488;
      --app-bg: #f8fafc;
      --app-card: #ffffff;
      --app-radius: 16px;
      --app-shadow: 0 25px 50px -12px rgba(0,0,0,.12);
    }
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: linear-gradient(160deg, #f0fdfa 0%, #f8fafc 50%, #e0f2fe 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      padding: 2rem 0;
    }
    .login-card {
      background: var(--app-card);
      border: none;
      border-radius: var(--app-radius);
      box-shadow: var(--app-shadow);
      overflow: hidden;
      padding: 2rem;
    }
    .login-header {
      text-align: center;
      margin-bottom: 1.75rem;
    }
    .login-header .icon-wrap {
      width: 64px;
      height: 64px;
      background: linear-gradient(135deg, var(--app-primary) 0%, var(--app-primary-dark) 100%);
      border-radius: 16px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 1rem;
    }
    .login-header .icon-wrap i { font-size: 1.75rem; color: #fff; }
    .login-header h1 {
      font-weight: 700;
      font-size: 1.5rem;
      color: #0f172a;
      letter-spacing: -0.02em;
    }
    .form-control, .btn {
      border-radius: 10px;
      padding: .6rem .85rem;
    }
    .form-control:focus {
      border-color: var(--app-primary);
      box-shadow: 0 0 0 3px rgba(13, 148, 136, .15);
    }
    .btn-login {
      background: linear-gradient(135deg, var(--app-primary) 0%, var(--app-primary-dark) 100%);
      border: none;
      font-weight: 600;
      padding: .65rem;
      transition: transform .15s, box-shadow .15s;
    }
    .btn-login:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(20, 184, 166, .4);
      color: #fff;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-5 col-lg-4">
        <div class="login-card">
          <div class="login-header">
            <div class="icon-wrap">
              <i class="bi bi-ticket-perforated-fill"></i>
            </div>
            <h1>Connexion</h1>
            <p class="text-muted small mb-0">Accédez à votre espace</p>
          </div>
          <form method="post" action="{% url 'tickets:login' %}">
            {% csrf_token %}
            {% if form.non_field_errors %}
              <div class="alert alert-danger rounded-3">{{ form.non_field_errors }}</div>
            {% endif %}
            <div class="mb-3">
              <label for="id_username" class="form-label fw-500">Identifiant</label>
              <div class="input-group">
                <span class="input-group-text bg-light border-end-0 rounded-start"><i class="bi bi-person text-muted"></i></span>
                <input type="text" name="username" id="id_username" class="form-control border-start-0 rounded-end" required autofocus
                       placeholder="Votre identifiant" value="{{ form.username.value|default:'' }}">
              </div>
              {% if form.username.errors %}<div class="form-text text-danger">{{ form.username.errors.0 }}</div>{% endif %}
            </div>
            <div class="mb-4">
              <label for="id_password" class="form-label fw-500">Mot de passe</label>
              <div class="input-group">
                <span class="input-group-text bg-light border-end-0 rounded-start"><i class="bi bi-lock text-muted"></i></span>
                <input type="password" name="password" id="id_password" class="form-control border-start-0 rounded-end" required placeholder="••••••••">
              </div>
              {% if form.password.errors %}<div class="form-text text-danger">{{ form.password.errors.0 }}</div>{% endif %}
            </div>
            <input type="hidden" name="next" value="{{ next }}">
            <button type="submit" class="btn btn-login btn-primary w-100">Se connecter</button>
          </form>
        </div>
      </div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
